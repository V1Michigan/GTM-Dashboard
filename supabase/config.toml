project_id = "v1-gtm-dashboard"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Catches outbound mail locally; nothing in v1 sends any.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# Raw CSV uploads (spec §4.6 imports.storage_path). Private: the files carry
# names, emails and resume links, and are served through the app's own routes.
[storage.buckets.imports]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["text/csv", "application/vnd.ms-excel", "text/plain"]

[auth]
enabled = true
site_url = "env(NEXT_PUBLIC_SITE_URL)"
additional_redirect_urls = ["http://localhost:3000", "http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false  # no self-serve sign-up; admins provision accounts in /settings
enable_anonymous_sign_ins = false

# Email + password is the only way in, and accounts are provisioned by an admin
# in /settings — never self-serve.
#
# The knob that closes sign-up is `[auth] enable_signup = false` above: it blocks
# the public /auth/v1/signup endpoint while leaving password sign-in working, and
# the Admin API used by provisionUser() is not subject to it. Do NOT set
# `[auth.email] enable_signup = false` to try to achieve this — that disables the
# email provider outright and refuses every LOGIN as well.
#
# The @umich.edu allowlist trigger on auth.users (migration 0012) backs this up.
# Confirmations are off so a provisioned account can sign in without SMTP.
[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.external.google]
enabled = false

[analytics]
enabled = false

# Stamps app_role onto the JWT so middleware needs no database round trip.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"
